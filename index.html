<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <main class="error-container">
        <div class="illustration">
            <div class="planet">
                <span class="planet-ring"></span>
                <span class="planet-face">☹</span>
            </div>
            <div class="star star-one">✦</div>
            <div class="star star-two">✧</div>
            <div class="star star-three">✦</div>
            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>
        </div>

        <div class="error-code">404</div>
        <h1>Oops! Lost in Space?</h1>
        <p class="message">
            Looks like this page has gone on a little adventure.
            Don't worry, even the best explorers get lost sometimes!
        </p>

        <a href="index.html" class="home-button">Back to Homepage <span>→</span></a>

        <p class="footer-text">Let's get you back on track! ✨</p>
    </main>
</body>
</html>
